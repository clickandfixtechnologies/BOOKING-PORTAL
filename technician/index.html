<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="theme-color"
        content="#2563eb"
    >

    <title>Technician Portal | Click & Fix Technologies</title>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <!-- Technician-only stylesheet -->
    <link
        rel="stylesheet"
        href="../css/technician.css"
    >

    <link
        rel="manifest"
        href="../manifest.webmanifest"
    >

</head>


<body class="tech-portal">

    <!-- =====================================================
         LOGIN VIEW
         ===================================================== -->

    <section id="loginView" class="tech-login-screen">

        <div class="tech-login-card">

            <div class="tech-login-brand">

                <div class="tech-login-logo">
                    CF
                </div>

                <div>
                    <h1 class="tech-login-title">
                        Technician Portal
                    </h1>

                    <p class="tech-login-subtitle">
                        Click &amp; Fix Technologies
                    </p>
                </div>

            </div>


            <h2 class="tech-login-heading">
                Technician sign in
            </h2>


            <input
                id="email"
                type="email"
                class="tech-input"
                placeholder="Email"
                autocomplete="username"
            >


            <input
                id="password"
                type="password"
                class="tech-input"
                placeholder="Password"
                autocomplete="current-password"
            >


            <button
                id="signIn"
                type="button"
                class="tech-login-button"
            >
                Sign in
            </button>


            <p
                id="loginError"
                class="tech-login-error"
            ></p>

        </div>

    </section>



    <!-- =====================================================
         PORTAL VIEW
         ===================================================== -->

    <section
        id="portalView"
        hidden
    >

        <div class="tech-app">


            <!-- =================================================
                 SIDEBAR
                 ================================================= -->

            <aside
                id="techSidebar"
                class="tech-sidebar"
            >

                <div>

                    <!-- Brand -->

                    <div class="tech-brand">

                        <div class="tech-brand-logo">
                            CF
                        </div>

                        <div>

                            <h1 class="tech-brand-title">
                                Technician Portal
                            </h1>

                            <p class="tech-brand-subtitle">
                                Click &amp; Fix Technologies
                            </p>

                        </div>

                    </div>


                    <!-- Navigation -->

                    <nav class="tech-nav">

                        <button
                            type="button"
                            class="tech-nav-item active"
                            data-nav="dashboard"
                        >
                            <i class="fa-solid fa-house"></i>
                            <span>Dashboard</span>
                        </button>


                        <button
                            type="button"
                            class="tech-nav-item"
                            data-nav="profile"
                        >
                            <i class="fa-solid fa-user"></i>
                            <span>Profile</span>
                        </button>


                        <button
                            type="button"
                            class="tech-nav-item"
                            data-nav="history"
                        >
                            <i class="fa-solid fa-clock-rotate-left"></i>
                            <span>History</span>
                        </button>


                        <button
                            type="button"
                            class="tech-nav-item"
                            data-nav="support"
                        >
                            <i class="fa-solid fa-circle-question"></i>
                            <span>Support</span>
                        </button>

                    </nav>

                </div>


                <!-- Sidebar Footer -->

                <div class="tech-sidebar-footer">
                    &copy; 2026 Click &amp; Fix Technologies
                </div>

            </aside>


            <!-- Mobile overlay -->

            <div
                id="techSidebarOverlay"
                class="tech-sidebar-overlay"
            ></div>



            <!-- =================================================
                 MAIN
                 ================================================= -->

            <div class="tech-main">


                <!-- =================================================
                     TOP BAR
                     ================================================= -->

                <header class="tech-topbar">


                    <div>

                        <button
                            id="techMenuBtn"
                            type="button"
                            class="tech-mobile-menu"
                            aria-label="Open menu"
                        >
                            <i class="fa-solid fa-bars"></i>
                        </button>


                        <div class="tech-mobile-brand">

                            <div class="tech-mobile-brand-logo">
                                CF
                            </div>

                            <span class="tech-mobile-brand-title">
                                Technician Portal
                            </span>

                        </div>

                    </div>



                    <!-- User -->

                    <div class="tech-user-area">

                        <div class="tech-user">

                            <img
                                class="tech-user-avatar"
                                src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=100"
                                alt="Technician"
                            >

                            <span
                                id="techUserName"
                                class="tech-user-name"
                            >
                                TECHNICIAN
                            </span>

                        </div>


                        <button
                            id="signOut"
                            type="button"
                            class="tech-signout"
                        >
                            <i class="fa-solid fa-right-from-bracket"></i>
                            <span>Sign Out</span>
                        </button>

                    </div>

                </header>



                <!-- =================================================
                     DASHBOARD CONTENT
                     ================================================= -->

                <main class="tech-content">

                    <div id="jobs"></div>

                    <div
                        id="detail"
                        class="tech-detail"
                    ></div>

                </main>

            </div>

        </div>

    </section>



    <!-- =====================================================
         CONFIG
         ===================================================== -->

    <script src="../js/runtime-config.js"></script>

    <script src="../js/app-config.js"></script>

    <script
        type="module"
        src="../js/technician.js"
    ></script>

    <script src="../js/pwa.js"></script>

</body>

</html>
